---
services:
  lychee:
    image: linuxserver/lychee:6.4.2
    container_name: lychee
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - DB_CONNECTION=sqlite
      - DB_HOST=
      - DB_PORT=
      - DB_USERNAME=lychee
      - DB_PASSWORD=lychee
      - DB_DATABASE=lychee
      - APP_NAME=Lychee #optional
      - APP_URL= #optional
      - TRUSTED_PROXIES= #optional
    volumes:
      - /path/to/lychee/config:/config
      - /path/to/pictures:/pictures
    ports:
      - 80:80
    restart: unless-stopped
    